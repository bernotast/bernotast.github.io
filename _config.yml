# Site settings
title: "Tadas Bernotas"
description: "Data manager at Erasmus University. Clinical Neuropsychology MSc."
url: "https://bernotast.github.io"
baseurl: ""

# About you (used on the home page)
author:
  name: "Tadas Bernotas"
  role: "Data manager at Erasmus University"
  location: "Tilburg"
  photo: "/assets/images/Bio_Photo.jpg"
  email: "tadas@odissei-data.nl"
