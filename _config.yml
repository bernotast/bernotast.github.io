# Build settings
markdown: kramdown
kramdown:
  input: GFM
permalink: /:year/:title/
timezone: Europe/Amsterdam

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
